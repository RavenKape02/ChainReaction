plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

javafx {
    version = '26'
    modules = ['javafx.controls']
}

application {
    mainModule = 'ChainReaction'
    mainClass = 'app.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

repositories {
    mavenCentral()
}
