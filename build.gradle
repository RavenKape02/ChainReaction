plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

javafx {
    version = '26'
    modules = ['javafx.controls', 'javafx.graphics']
}

application {
    mainModule = 'ChainReaction'
    mainClass = 'app.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

repositories {
    mavenCentral()
}

tasks.register("startApi", Exec) {
    workingDir rootProject.projectDir
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) {
        commandLine "powershell", "-Command", "Start-Process node -ArgumentList 'service' -WindowStyle Hidden"
    } else {
        commandLine "sh", "-c", "nohup node service >/dev/null 2>&1 &"
    }
}
